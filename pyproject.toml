[project]
name = "sat-maule"
version = "0.1.0"
description = "SAT-Maule: Sistema de Alerta Temprana para la Región del Maule, Chile."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "motor>=3.5,<4",
    "httpx>=0.27",
    "pywebpush>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pywebpush.*", "motor.*"]
ignore_missing_imports = true
